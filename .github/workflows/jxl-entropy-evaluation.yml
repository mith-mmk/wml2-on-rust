name: JXL entropy budget evaluation
on:
  pull_request:
    paths:
      - '.github/workflows/jxl-entropy-evaluation.yml'
      - 'wml2-test/scripts/*entropy_budget*'
      - 'docs/jpeg-xl-entropy-budget-evaluation.*'
permissions:
  contents: read
jobs:
  explicit-low-level-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified evaluation patch and execute scoped denial tests
        run: python -B wml2-test/scripts/evaluate_jpegxl_entropy_budget.py --output .test-entropy-ci --wasm --wml-regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jxl-entropy-budget-evaluation
          include-hidden-files: true
          path: |
            .test-entropy-ci/report.json
            .test-entropy-ci/*.log
            .test-entropy-ci/wasm-runtime.json
