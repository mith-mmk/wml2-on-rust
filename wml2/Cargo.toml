[package]
name = "wml2"
version = "0.0.27"
repository = "https://github.com/mith-mmk/wml2-on-rust"
homepage = "https://mith-mmk.github.io/"
authors = ["mith-mmk <47620686+mith-mmk@users.noreply.github.com>"]
description = "Pure Rust multi-format image decoding and encoding library supporting JPEG, PNG, GIF, WebP, TIFF and PC-98 legacy formats (MAG, MAKI, PI, PIC)"
edition = "2024"
rust-version = "1.91"
license = "MIT"
keywords = ["image","codec","jpeg","webp","png"]
categories = ["multimedia::images","encoding"]

[lib]
crate-type = ["rlib"] 

[[test]]
name = "avif_decode"
path = "tests/avif_decode.rs"
required-features = ["avif"]

[[test]]
name = "avif_feature_off"
path = "tests/avif_feature_off.rs"

[[test]]
name = "avif_encode"
path = "tests/avif_encode.rs"
required-features = ["avifenc"]

[[test]]
name = "avif_encode_sample"
path = "tests/avif_encode_sample.rs"
required-features = ["avifenc", "webp"]

# These integration tests exercise optional codec modules directly. Keep them
# out of feature-off builds so the feature matrix can still compile and run
# the core/AVIF regression targets without pulling every codec in.
[[test]]
name = "convert"
path = "tests/convert.rs"
required-features = ["jpeg", "png", "tiff"]

[[test]]
name = "image_to"
path = "tests/image_to.rs"
required-features = ["bmp", "png", "webp"]

[[test]]
name = "jpeg_encode"
path = "tests/jpeg_encode.rs"
required-features = ["jpeg"]

[[test]]
name = "png_encode"
path = "tests/png_encode.rs"
required-features = ["png"]

[[test]]
name = "tiff_encode"
path = "tests/tiff_encode.rs"
required-features = ["tiff"]

[[test]]
name = "webp_encode"
path = "tests/webp_encode.rs"
required-features = ["webp"]

[[test]]
name = "error_recovery"
path = "tests/error_recovery.rs"
required-features = ["webp", "tiff"]

[[test]]
name = "gif_encode"
path = "tests/gif_encode.rs"
required-features = ["gif"]

[[test]]
name = "retro_formats"
path = "tests/retro_formats.rs"
required-features = ["maki", "pi", "pic", "vsp"]

[[test]]
name = "webp_decode"
path = "tests/webp_decode.rs"
required-features = ["webp"]

[features]
# Recommended build: all standard formats, EXIF support, embedded-format bridges,
# and the LL&M JPEG IDCT implementation.
default = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "tiff",
    "webp",
    "mag",
    "maki",
    "pcd",
    "pi",
    "pic",
    "vsp",
    "exif",
    "bmp-jpeg",
    "bmp-png",
    "tiff-jpeg",
    "ico-bmp",
    "ico-png",
    "idct_llm",
    "c2pa",
]

c2pa = []
exif = []
bmp = []
gif = []
ico = []
jpeg = ["exif"]
png = ["exif"]
tiff = ["exif"]
webp = ["exif", "dep:webp_codec"]
avif = ["dep:avif_codec"]
avifenc = ["avif", "dep:avifenc_codec"]
mag = []
maki = []
pcd = []
pi = []
pic = []
vsp = []


# Embedded/bridged codec support for container formats that reuse other decoders.
bmp-jpeg = ["bmp", "jpeg"]
bmp-png = ["bmp", "png"]
tiff-jpeg = ["tiff", "jpeg"]
ico-bmp = ["ico", "bmp"]
ico-png = ["ico", "png"]

# JPEG IDCT implementation.
# The recommended/default choice is `idct_llm`.
# Pick exactly one of `idct_llm`, `idct_aan`, or `idct_slower`.
idct_llm = []
idct_aan = []
idct_slower = []

# Use the slower reference FDCT in the JPEG encoder.
fdct_slower = []

# Miscellaneous build toggles.
multithread = []
SJIS = []
noretoro = []

[dependencies]
bin-rs = {version = "0.0.10",features = ["util"]}
#bin-rs = { git = "https://github.com/mith-mmk/bin-rs", features = ["util"], ref="3fb43f7" }
webp_codec = { package = "webp-rust", version = "0.3.0", optional = true }
avif_codec = { package = "avif-rust", version = "0.0.6", path = "../avif", optional = true }
avifenc_codec = { package = "avifenc-rust", version = "0.1.0", path = "../avifenc", optional = true }

miniz_oxide = {version = "0.7.1"}
