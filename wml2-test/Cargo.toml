[package]
name = "wml2-test"
version = "0.1.0"
edition = "2024"

license = "MIT"
description = "Image decoder/encoder test and samples."
authors = ["MITH@mmk"]
readme = "README.md"

[features]
default = []
avif = ["wml2/avif"]
avifenc = ["wml2/avifenc"]

[dependencies]
dotenv = "0.15"
encoding_rs = "0.8"

[dependencies.wml2]
path = "../wml2"
features = ["multithread"]

[dependencies.icc-profile]
version = "0.0.5"
