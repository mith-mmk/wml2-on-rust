name: checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Superseded PR commits may stop; main, manual and release checks always finish.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.core_matrix }}
      avif_matrix: ${{ steps.plan.outputs.avif_matrix }}
      modes: ${{ steps.plan.outputs.modes }}
      smoke: ${{ steps.plan.outputs.smoke }}
      full: ${{ steps.plan.outputs.full }}
      avif: ${{ steps.plan.outputs.avif }}
      jpeg2000: ${{ steps.plan.outputs.jpeg2000 }}
      jpegxl: ${{ steps.plan.outputs.jpegxl }}
      tiff: ${{ steps.plan.outputs.tiff }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select checks conservatively
        id: plan
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -B .github/scripts/select_ci.py
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Validate current version notes
        run: python -B .github/scripts/release_notes.py
  avif-oracles:
    needs: select
    if: needs.select.outputs.avif == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Probe existing tools and pin official Ubuntu fallback
        id: ffmpeg
        run: python3 -B .github/scripts/prepare_ffmpeg.py plan
      - uses: actions/cache/restore@v4
        id: ffmpeg-cache
        if: steps.ffmpeg.outputs.ready == 'false'
        with:
          path: .test-ffmpeg-debs/*.deb
          key: ${{ steps.ffmpeg.outputs.package_key }}
      - name: Install pinned distro packages and verify actual oracle operations
        if: steps.ffmpeg.outputs.ready == 'false'
        run: python3 -B .github/scripts/prepare_ffmpeg.py install
      - uses: actions/cache/save@v4
        if: steps.ffmpeg.outputs.ready == 'false' && steps.ffmpeg-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: .test-ffmpeg-debs/*.deb
          key: ${{ steps.ffmpeg.outputs.package_key }}
      - name: Mark package availability for same-run consumers
        run: |
          mkdir -p .test-ffmpeg-debs
          touch .test-ffmpeg-debs/package-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-packages
          include-hidden-files: true
          path: |
            .test-ffmpeg-debs/*.deb
            .test-ffmpeg-debs/package-info.json
          if-no-files-found: error
      - name: Bootstrap AVIF oracles once per run
        run: pwsh -File avif/scripts/bootstrap_oracles.ps1
      # Data only, consumed by read-only tests in this run. Never by publication.
      - uses: actions/upload-artifact@v4
        with:
          name: avif-oracles
          path: avif/test_data
          if-no-files-found: error

  codec-smoke:
    needs: select
    if: needs.select.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.91.0', stable]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: features-jpeg2000,image-buffer-ex-ci
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Exact bounded integration contracts
        env:
          CODEC_MODES: ${{ needs.select.outputs.modes }}
        run: python3 -B .github/scripts/run_codec_smoke.py --modes "$CODEC_MODES"

  test:
    name: test (${{ matrix.rust }}, ${{ matrix.features }})
    needs: select
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: features-${{ matrix.features }}-${{ matrix.profile }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Test selected feature set
        env:
          FEATURES: ${{ matrix.features }}
          TEST_PROFILE: ${{ matrix.profile }}
        run: python3 -B .github/scripts/run_feature_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ matrix.rust }}-${{ strategy.job-index }}
          path: |
            clippy.json
            Cargo.lock
  avif-test:
    name: test (${{ matrix.rust }}, ${{ matrix.features }})
    needs: [select, avif-oracles]
    if: needs.select.outputs.avif == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.avif_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: avif-oracles
          path: avif/test_data
      # Encoder tests themselves invoke FFmpeg. Keep that independent oracle,
      # reusing authenticated packages from this run instead of downloading them
      # independently in every feature/toolchain row.
      - name: Probe existing tools and resolve the official package transaction
        if: matrix.ffmpeg
        id: ffmpeg
        run: python3 -B .github/scripts/prepare_ffmpeg.py plan
      - uses: actions/download-artifact@v4
        if: matrix.ffmpeg && steps.ffmpeg.outputs.ready == 'false'
        with:
          name: ffmpeg-packages
          path: .test-ffmpeg-debs
      - name: Install and validate FFmpeg for independent encoder tests
        if: matrix.ffmpeg && steps.ffmpeg.outputs.ready == 'false'
        run: python3 -B .github/scripts/prepare_ffmpeg.py install
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: features-${{ matrix.features }}-${{ matrix.profile }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Test selected feature set
        env:
          FEATURES: ${{ matrix.features }}
          TEST_PROFILE: ${{ matrix.profile }}
          WML2_REQUIRE_FFMPEG: '1'
        run: python3 -B .github/scripts/run_feature_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-avif-${{ matrix.rust }}-${{ strategy.job-index }}
          path: |
            clippy.json
            Cargo.lock
  platform:
    needs: select
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo test -p wml2 --test review_regressions --no-default-features --features png
      - name: JPEG2000 regression fixtures
        if: needs.select.outputs.jpeg2000 == 'true'
        run: cargo test -p wml2 --locked --profile ci --test jpeg2000 --no-default-features --features jpeg2000
      - name: TIFF container and review regressions
        if: needs.select.outputs.tiff == 'true'
        run: cargo test -p wml2 --test tiff_extend --test tiff_review_regressions --no-default-features --features tiff,high-bit-depth
      - name: TIFF interoperability fixtures
        if: needs.select.outputs.tiff == 'true'
        run: cargo test -p wml2 --test tiff_interop --test tiff_ycbcr --test tiff_jpeg_extend --no-default-features --features tiff-jpeg,idct_llm
      - name: AVIF ICC reconstruction and selected alpha regressions
        if: needs.select.outputs.avif == 'true'
        run: cargo test -p wml2 --locked --no-default-features --features avif,image-buffer-ex,color-management --lib --test avif_color_boundary
      - name: Install 32-bit Windows target
        if: runner.os == 'Windows' && (needs.select.outputs.jpeg2000 == 'true' || needs.select.outputs.tiff == 'true')
        run: rustup target add i686-pc-windows-msvc
      - name: JPEG2000 EX and native reduction 32-bit boundaries
        if: runner.os == 'Windows' && needs.select.outputs.jpeg2000 == 'true'
        run: cargo test -p wml2 --locked --profile ci --target i686-pc-windows-msvc --test jpeg2000_ex --test jpeg2000_ex_color --test jpeg2000_ex_97 --test jpeg2000_ex_memory --test jpeg2000_reduced --no-default-features --features jpeg2000,image-buffer-ex
      - name: JPEG2000 single-segment MQ 32-bit equivalence
        if: runner.os == 'Windows' && needs.select.outputs.jpeg2000 == 'true'
        run: cargo test -p wml2 --locked --profile ci --target i686-pc-windows-msvc --no-default-features --features jpeg2000,image-buffer-ex --lib jpeg2000::tier1::tests::single_style_zero_segment_matches_generic_midpoint_reader
      - name: TIFF 32-bit offsets and strip geometry
        if: runner.os == 'Windows' && needs.select.outputs.tiff == 'true'
        run: cargo test -p wml2 --target i686-pc-windows-msvc --test tiff_extend --test tiff_review_regressions --no-default-features --features tiff,high-bit-depth
      - name: TIFF 32-bit interoperability fixtures
        if: runner.os == 'Windows' && needs.select.outputs.tiff == 'true'
        run: cargo test -p wml2 --target i686-pc-windows-msvc --test tiff_interop --test tiff_ycbcr --test tiff_jpeg_extend --no-default-features --features tiff-jpeg,idct_llm
  jpeg-xl-platform:
    needs: select
    if: needs.select.outputs.jpegxl == 'true'
    name: JPEG XL / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: JPEG XL disabled detection contract
        run: cargo test -p wml2 --locked --no-default-features --test jpeg_xl --test jpeg_xl_additional --test jpeg_xl_layers
      - name: JPEG XL ordinary RGBA8 and source metadata
        run: cargo test -p wml2 --locked --no-default-features --features jpeg-xl --lib --test jpeg_xl --test jpeg_xl_additional --test jpeg_xl_layers
      - name: JPEG XL native EX precision, limits and Abort
        run: cargo test -p wml2 --locked --no-default-features --features jpeg-xl,image-buffer-ex --lib --test jpeg_xl --test jpeg_xl_additional --test jpeg_xl_layers
      - name: JPEG XL explicit sRGB display with own ICC engine
        run: cargo test -p wml2 --locked --no-default-features --features jpeg-xl,image-buffer-ex,color-management --lib --test jpeg_xl --test jpeg_xl_additional --test jpeg_xl_layers
      - name: Install 32-bit Windows JPEG XL target
        if: runner.os == 'Windows'
        run: rustup target add i686-pc-windows-msvc
      - name: JPEG XL 32-bit Windows ordinary, EX and disabled contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test -p wml2 --locked --target i686-pc-windows-msvc --no-default-features --features jpeg-xl --lib --test jpeg_xl --test jpeg_xl_additional --test jpeg_xl_layers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p wml2 --locked --target i686-pc-windows-msvc --no-default-features --features jpeg-xl,image-buffer-ex --lib --test jpeg_xl --test jpeg_xl_additional --test jpeg_xl_layers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p wml2 --locked --target i686-pc-windows-msvc --no-default-features --test jpeg_xl --test jpeg_xl_additional --test jpeg_xl_layers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  feature-contracts:
    name: Compatible features and IDCT conflict
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Check all compatible targets and expected all-features rejection
        run: python -B .github/scripts/check_feature_contracts.py --output .test-feature-contracts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-contracts
          include-hidden-files: true
          path: .test-feature-contracts
  compile:
    needs: select
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [wasm32-unknown-unknown, i686-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo check -p wml2 --locked --lib --target ${{ matrix.target }} --features high-bit-depth,color-management,avifenc,image-buffer-ex,psd,tiff-jpeg,idct_llm,jpeg2000,jpeg-xl
      - uses: actions/setup-node@v4
        if: matrix.target == 'wasm32-unknown-unknown'
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        if: matrix.target == 'wasm32-unknown-unknown'
        with:
          python-version: '3.12'
      - name: Execute native JPEG XL EX fixtures in actual WASM
        if: matrix.target == 'wasm32-unknown-unknown' && needs.select.outputs.jpegxl == 'true'
        run: python -B wml2-test/scripts/verify_jpegxl_wasm.py --output .test-jpeg-xl-wasm
      - uses: actions/upload-artifact@v4
        if: always() && matrix.target == 'wasm32-unknown-unknown' && needs.select.outputs.jpegxl == 'true'
        with:
          name: jpeg-xl-wasm-runtime
          include-hidden-files: true
          path: |
            .test-jpeg-xl-wasm/report.json
            .test-jpeg-xl-wasm/*.log
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -p wml2 --check

  tiff-oracle:
    needs: select
    if: needs.select.outputs.tiff == 'true'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Install TIFF oracle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick libtiff-tools python3-pil
          convert --version
          /usr/bin/python3 -c 'from PIL import Image; print("Pillow", Image.__version__)'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Checkout pinned TIFF interoperability corpus
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: imazen/codec-corpus
          ref: 8e10d4d765667c1c49d74413878fc4bfb46dcf8d
          path: .ci/codec-corpus
          fetch-depth: 1
      - name: Verify and expose external TIFF corpus
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .ci/codec-corpus rev-parse HEAD)" = "8e10d4d765667c1c49d74413878fc4bfb46dcf8d"
          corpus=".ci/codec-corpus/tiff-conformance/valid"
          test -n "$corpus"
          for sample in \
            fax4.tiff \
            ojpeg_single_strip_no_rowsperstrip.tiff \
            ojpeg_zackthecat_subsamp22_single_strip.tiff; do
            test -f "$corpus/$sample"
          done
          /usr/bin/python3 wml2-test/scripts/verify_tiff_interop_samples.py \
            --corpus "$corpus" \
            --manifest wml2/tests/fixtures/tiff_interop/manifest.json
          echo "WML2_TIFF_CORPUS=$GITHUB_WORKSPACE/$corpus" >> "$GITHUB_ENV"
      - name: Run pinned external TIFF interoperability tests
        run: cargo test -p wml2 --locked --test tiff_interop --no-default-features --features tiff-jpeg,idct_llm,image-buffer-ex -- --ignored
      - name: Build sample converter and metadata tools
        run: cargo build -p wml2-test --locked --release --example converter --example metadata
      - name: Generate TIFF review and alpha/LZW samples
        env:
          SAMPLE_ROOT: ${{ runner.temp }}/wml2-tiff-oracle/samples
        run: |
          /usr/bin/python3 wml2-test/scripts/generate_tiff_review_samples.py --dest "$SAMPLE_ROOT/review"
          /usr/bin/python3 wml2-test/scripts/generate_tiff_alpha_lzw_samples.py --dest "$SAMPLE_ROOT/alpha-lzw"
          /usr/bin/python3 wml2-test/scripts/generate_tiff_lzw_modes_samples.py --dest "$SAMPLE_ROOT/lzw-modes"
      - name: Run converter metadata and independent LibTIFF oracle
        env:
          SAMPLE_ROOT: ${{ runner.temp }}/wml2-tiff-oracle/samples
          REPORT_ROOT: ${{ runner.temp }}/wml2-tiff-oracle/reports
        run: |
          mkdir -p "$REPORT_ROOT"
          /usr/bin/python3 wml2-test/scripts/verify_tiff_review_samples.py \
            --samples "$SAMPLE_ROOT/review" \
            --output "$REPORT_ROOT/review" \
            --converter "$GITHUB_WORKSPACE/target/release/examples/converter" \
            --metadata "$GITHUB_WORKSPACE/target/release/examples/metadata" \
            --magick convert
          /usr/bin/python3 wml2-test/scripts/verify_tiff_lzw_modes.py \
            --samples "$SAMPLE_ROOT/lzw-modes" \
            --output "$REPORT_ROOT/lzw-modes" \
            --converter "$GITHUB_WORKSPACE/target/release/examples/converter" \
            --metadata "$GITHUB_WORKSPACE/target/release/examples/metadata" \
            --magick convert
          /usr/bin/python3 wml2-test/scripts/verify_tiff_review_samples.py \
            --samples "$SAMPLE_ROOT/alpha-lzw" \
            --output "$REPORT_ROOT/alpha-lzw" \
            --converter "$GITHUB_WORKSPACE/target/release/examples/converter" \
            --metadata "$GITHUB_WORKSPACE/target/release/examples/metadata" \
            --magick convert
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiff-oracle-reports
          path: ${{ runner.temp }}/wml2-tiff-oracle/reports

  required-checks:
    name: Required checks
    if: always()
    needs: [select, release-metadata, test, avif-oracles, avif-test, codec-smoke, platform, jpeg-xl-platform, feature-contracts, compile, format, tiff-oracle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject failures, cancellation and unexpected skips
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python -B .github/scripts/verify_ci.py
